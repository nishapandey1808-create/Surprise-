<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Anant ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
}

.container {
    margin-top: 70px;
}

h1 {
    font-size: 50px;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #fff; }
    to { text-shadow: 0 0 25px #ff004f; }
}

p {
    font-size: 22px;
    width: 80%;
    margin: auto;
}

button {
    margin-top: 25px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #ff4081;
    cursor: pointer;
}

button:hover {
    background: #ffe6ec;
}

#surprise {
    display: none;
    margin-top: 30px;
}

img {
    width: 300px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.love {
    font-size: 26px;
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <h1>Happy Birthday Anant 💖</h1>

    <p>
        You are the most special part of my life.  
        Every moment with you feels like a dream come true ✨  
    </p>

    <button onclick="showSurprise()">Click Here 💌</button>

    <div id="surprise">
        <img src="your-photo.jpg" alt="Our Photo">
        <div class="love">Love you forever ❤️</div>
    </div>
</div>

<script>
function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}
</script>

</body>
</html>
