<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Anant ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
}

.container {
    margin-top: 80px;
}

h1 {
    font-size: 55px;
    animation: glow 1.5s infinite alternate;
}

p {
    font-size: 22px;
    width: 80%;
    margin: auto;
    line-height: 1.6;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #fff; }
    to { text-shadow: 0 0 25px #ff004f; }
}

.heart {
    font-size: 80px;
    animation: beat 1s infinite;
}

@keyframes beat {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #ff4081;
    cursor: pointer;
}

button:hover {
    background: #ffe6ec;
}

#message {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">❤️</div>
    <h1>Happy Birthday Anant 💖</h1>

    <p>
        On this special day, I just want to tell you how much you mean to me.  
        You are not just my love, you are my happiness, my peace, and my biggest reason to smile 😊  
        I feel lucky to have you in my life.  
    </p>

    <button onclick="showMessage()">Click for a Special Message 💌</button>

    <div id="message"></div>
</div>

<script>
function showMessage() {
    document.getElementById("message").innerHTML =
    "I love you so much Anant ❤️ Forever yours 💫";
}
</script>

</body>
</html>
